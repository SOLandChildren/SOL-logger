<!-- this page is never used -->
{% extends "layout.html" %}
{% block content %}
<div class="app-page">
  <div class="app-toolbar"></div>
  <section class="app-panel no-result-panel">
    {% if query != corrected_query %}
    <small class="container-info"><p>Did you mean: <a id="did-you-mean" href="{{ url_for('result', query=corrected_query, page=1)|safe }}"><b>{{ corrected_query|safe }}</b></a></p></small>
    {% endif %}

    <p id="no-results" query="{{ query|safe }}">Nessun risultato trovato per questa ricerca!</p>
  </section>
</div>
{% endblock content %}
