{% extends "layout.html" %}
{% block content %}

<div class="app-page">
  <div class="app-toolbar"></div>

  <section class="app-panel search-panel">
    <div class="home-search-center">
      <div class="home-search-title">
        <span class="sol-red">C</span><span class="sol-green">e</span><span class="sol-blue">r</span><span class="sol-yellow">c</span><span class="sol-red">a</span>
      </div>

      <form method="POST" action="{{ url_for('result') }}" id="search-bar" class="home-search-form">
        {{ form.hidden_tag() }}
        <input
            list="query-suggestions"
            type="search"
            name="query"
            id="search-box"
            placeholder="Cerca..."
            aria-label="Cerca"
            autocomplete="off"
            list="query-suggestions">
        <datalist id="query-suggestions"></datalist>
        <button type="submit" name="submit-box" id="submit-box" class="app-btn app-btn-primary">Cerca</button>
      </form>
      <p class="search-error-message" {% if not search_error %}hidden{% endif %}>
        {{ search_error or "Inserisci una domanda prima di cercare." }}
      </p>
    </div>
  </section>
</div>
{% endblock content %}
