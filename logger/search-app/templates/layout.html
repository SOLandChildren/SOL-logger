<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">    
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='main.css') }}?">

    {% if title %}
        <title>Search App - {{ title }}</title>
    {% else %}
        <title>Search App</title>
    {% endif %}
</head>
<body>
    <main role="main" class="app-main">
        {% block content %}{% endblock content %}
    </main>

    <div id="endTaskModal" class="modal">
        <div class="modal-content-box">
            <span class="close" onclick="window._endTaskCloseReason='x-close'; closeEndTaskModal()">&times;</span>
            <h2>Sei sicuro di voler terminare il compito?</h2>
            <p>Non potrai tornare indietro. Vuoi davvero terminare il compito adesso?</p>

        <!-- <div id="savedDocuments">
        <a href="#" id="toggleSavedLink" onclick="toggleSavedTitles(event)">See saved documents ▼</a>
        <ul id="savedTitles" style="display: none;" ></ul>
        </div> -->

        <div class="modal-buttons">
        <!-- <button id = "yes-end-btn" class="btn btn-primary" onclick="closeEndTaskModal();openFeedbackModal()">Yes, end task</button> -->
        <button id = "yes-end-btn" class="app-btn app-btn-primary">Si, termina</button>

        <button id = "no-end-btn" onclick="window._endTaskCloseReason='no-btn'; closeEndTaskModal(); openFeedbackModal()" class="app-btn app-btn-secondary">No, continua a cercare</button>
        </div>
        </div>
    </div>

    <div id="feedbackModal" class="modal">
    <div class="modal-content-box">
        <span class="close" onclick="window._feedbackCloseReason='x-close'; closeFeedbackModal()">&times;</span>
        <h2>Hai completato la risposta?</h2>

            <div id="feedback">
                <textarea id="textarea_feedback" name="feedbackText" cols="40" rows="5"></textarea>
                <p id="answer-error-message" class="form-error" hidden>Inserisci una risposta</p>
            </div>

            <div class="modal-buttons">
                <button id="feedback-btn" class="app-btn app-btn-primary">Invia risposta e termina</button>
                <button id="continue-search-btn" class="app-btn app-btn-secondary">Continua a cercare</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>

        <script>
        const input = document.getElementById("search-box");
        const list = document.getElementById("query-suggestions");

        let debounceTimer;
        let activeIndex = -1;
        window.autoCompleteSuggestions = [];

        input.setAttribute("role", "combobox");
        input.setAttribute("aria-autocomplete", "list");
        input.setAttribute("aria-expanded", "false");
        input.setAttribute("aria-controls", list.id);

        input.addEventListener("input", () => {
            const query = input.value.trim();
            list.innerHTML = "";
            activeIndex = -1;

            if (query.length < 3) {
                hideList();
                return;
            }

            clearTimeout(debounceTimer);

            debounceTimer = setTimeout(() => {
                fetchSuggestions(query);
            }, 300);
        });

        input.addEventListener("keydown", (e) => {
            const items = list.querySelectorAll("li");
            if (!items.length) return;

            if (e.key === "ArrowDown") {
                e.preventDefault();
                activeIndex = (activeIndex + 1) % items.length;
                updateActive(items);
            }

            if (e.key === "ArrowUp") {
                e.preventDefault();
                activeIndex =
                    (activeIndex - 1 + items.length) % items.length;
                updateActive(items);
            }

            if (e.key === "Enter" && activeIndex >= 0) {
                e.preventDefault(); // don’t submit form yet
                select(items[activeIndex].textContent);
            }

            if (e.key === "Escape") {
                hideList();
            }
        });

        async function fetchSuggestions(query) {
            try {
                const response = await fetch(
                    `/autocomplete?query=${encodeURIComponent(query)}`
                );

                if (!response.ok) return;

                const suggestions = await response.json();
                window.autoCompleteSuggestions = suggestions;

                list.innerHTML = "";

                suggestions.forEach(value => {
                    const li = document.createElement("li");
                    li.textContent = value;
                    li.role = "option";
                    li.setAttribute("aria-selected", "false");

                    li.addEventListener("mousedown", () => {
                        select(value);
                    });

                    list.appendChild(li);
                });

                showList();

            } catch (err) {
                console.error("Autocomplete error:", err);
            }
        }

        function updateActive(items) {
            items.forEach((el, i) =>
                el.setAttribute("aria-selected", i === activeIndex)
            );
        }

        function select(value) {
            input.value = value;
            hideList();
        }

        function showList() {
            list.classList.remove("hidden");
            input.setAttribute("aria-expanded", "true");
        }

        function hideList() {
            list.classList.add("hidden");
            input.setAttribute("aria-expanded", "false");
        }

        document.addEventListener("click", (e) => {
            if (!e.target.closest("#query-suggestions") &&
                e.target !== input) {
                hideList();
            }
        });
    </script>

    <script>
        let isSubmitting = false;
        const finalbtn = document.getElementById("feedback-btn");
        const continueBtn = document.getElementById("continue-search-btn");
        const yesEndBtn = document.getElementById("yes-end-btn");

        if (finalbtn) {
            finalbtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (isSubmitting) return;

                const answerBox = document.getElementById("textarea_feedback");
                const answerError = document.getElementById("answer-error-message");
                if (!answerBox || !answerBox.value.trim()) {
                    e.stopImmediatePropagation();
                    if (answerError) {
                        answerError.hidden = false;
                    }
                    if (answerBox) {
                        answerBox.focus();
                    }
                    return;
                }
                if (answerError) {
                    answerError.hidden = true;
                }

                if (typeof saveDraftAnswer === 'function') {
                    saveDraftAnswer(answerBox.value);
                }

                document.getElementById("feedbackModal").style.display = "none";
                openEndTaskModal();
            });
        }

        if (yesEndBtn) {
            yesEndBtn.addEventListener('click', async () => {
                if (isSubmitting) return;
                isSubmitting = true;
                yesEndBtn.disabled = true;
                if (finalbtn) finalbtn.disabled = true;
                if (continueBtn) continueBtn.disabled = true;

                window._endTaskCloseReason = 'confirmed';
                document.getElementById("endTaskModal").style.display = "none";

                await Promise.resolve();

                const answerBox = document.getElementById("textarea_feedback");
                const answer = answerBox ? answerBox.value : "";

                try {
                    if (window.studyLogger) {
                        window._feedbackCloseReason = 'submitted';
                        if (typeof window.flushActiveResultExposures === "function") {
                            window.flushActiveResultExposures("task-end");
                        }
                        if (typeof window.logOpenWebpageClosed === "function") {
                            window.logOpenWebpageClosed("end-task-button");
                        }
                        if (!window.taskEndedLogged) {
                            studyLogger.logEvent("TaskEnded", { answer });
                            window.taskEndedLogged = true;
                        }
                        await studyLogger.sendLogs();
                    }

                    const response = await fetch('/end', {
                        method: 'POST',
                        redirect: 'manual'
                    });

                    if (response.type === 'opaqueredirect' || response.status === 0 || (response.status >= 300 && response.status < 400)) {
                        clearDraftAnswer();
                        clearClientData();
                        window.location.href = "{{ url_for('reward') }}";
                        return;
                    }

                    console.error('Unexpected response:', await response.text());
                    isSubmitting = false;
                    yesEndBtn.disabled = false;
                    if (finalbtn) finalbtn.disabled = false;
                    if (continueBtn) continueBtn.disabled = false;
                } catch (err) {
                    console.error('Error ending task:', err);
                    isSubmitting = false;
                    yesEndBtn.disabled = false;
                    if (finalbtn) finalbtn.disabled = false;
                    if (continueBtn) continueBtn.disabled = false;
                }
            });
        }

        if (continueBtn) {
            continueBtn.addEventListener('click', () => {
                if (isSubmitting) return;
                window._feedbackCloseReason = 'continue-search';
                closeFeedbackModal();
            });
        }
    </script>

    <script>
    function answerStorageKey() {
        const sid = window.SESSION_ID || "unknown";
        const tnum = window.TASK_NUMBER || "unknown";
        return `answer_${sid}_${tnum}`;
    }
    function loadDraftAnswer() {
        try { return sessionStorage.getItem(answerStorageKey()) || ""; } catch (_) { return ""; }
    }
    function saveDraftAnswer(value) {
        try { sessionStorage.setItem(answerStorageKey(), value); } catch (_) {}
    }
    function clearDraftAnswer() {
        try { sessionStorage.removeItem(answerStorageKey()); } catch (_) {}
    }

    window._endTaskCloseReason = null;
    window._feedbackCloseReason = null;

    function openEndTaskModal() {
        document.getElementById("endTaskModal").style.display = "flex";
        if (window.studyLogger && !window.clickedEndTaskLogged) {
            studyLogger.logEvent("ClickedEndTask");
            window.clickedEndTaskLogged = true;
        }
        // populateSavedDocuments();
    }

    function openFeedbackModal() {
        if (window.studyLogger) {
            studyLogger.logEvent("AnswerBoxRevealed");
        }
        document.getElementById("feedbackModal").style.display = "flex";
        const answerError = document.getElementById("answer-error-message");
        if (answerError) {
            answerError.hidden = true;
        }
        const answerBox = document.getElementById("textarea_feedback");
        if (answerBox) {
            answerBox.value = loadDraftAnswer();
            setTimeout(() => answerBox.focus(), 0);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const answerBox = document.getElementById("textarea_feedback");
        if (!answerBox) return;
        const draft = loadDraftAnswer();
        if (draft) {
            answerBox.value = draft;
        }
        answerBox.addEventListener('input', (e) => {
            saveDraftAnswer(e.target.value);
        });
    });

    function closeEndTaskModal() {
        document.getElementById("endTaskModal").style.display = "none";
        if (window._endTaskCloseReason === 'x-close' && window.studyLogger) {
            studyLogger.logEvent("EndTaskDialogClosed", { reason: "x-close" });
        }
        // 'no-btn': existing logger.js listener emits TaskContinued; do not re-emit.
        // 'confirmed': openFeedbackModal logs AnswerBoxRevealed on the next step.
        window._endTaskCloseReason = null;
    }

    function closeFeedbackModal() {
        document.getElementById("feedbackModal").style.display = "none";
        if (window._feedbackCloseReason === 'x-close' && window.studyLogger) {
            studyLogger.logEvent("AnswerBoxClosed", { reason: "x-close" });
        } else if (window._feedbackCloseReason === 'continue-search' && window.studyLogger) {
            studyLogger.logEvent("AnswerBoxClosed", { reason: "continue-search" });
        }
        // 'submitted' or null: TaskEnded covers the end-of-task event.
        window._feedbackCloseReason = null;
    }

    function toggleSavedTitles(event) {
        event.preventDefault();
        const list = document.getElementById('savedTitles');
        const link = document.getElementById('toggleSavedLink');

        if (!list || !link) return;

        const isVisible = list.style.display === 'block';
        list.style.display = isVisible ? 'none' : 'block';
        link.innerHTML = isVisible ? 'See saved documents ▼' : 'Hide saved documents ▲';
    }

    function populateSavedDocuments() {
        const argumentSelections = JSON.parse(localStorage.getItem('argumentSelections') || '{}');
        const savedTitles = JSON.parse(localStorage.getItem('savedTitles') || '{}');
        const savedTitlesUl = document.getElementById('savedTitles');
        if (!savedTitlesUl) return;

        savedTitlesUl.innerHTML = '';

        for (const docid in argumentSelections) {
            const li = document.createElement('li');
            li.textContent = (argumentSelections[docid].toUpperCase() === 'PRO' ? 'PRO: ' : 'CON: ') + (savedTitles[docid] || `ID: ${docid}`);
            li.classList.add(argumentSelections[docid] === 'pro' ? 'pro-vote' : 'con-vote');
            savedTitlesUl.appendChild(li);
        }
    }
    </script>

    <script>
    const argumentSelections = JSON.parse(localStorage.getItem('argumentSelections') || '{}');
    const savedTitles = JSON.parse(localStorage.getItem('savedTitles') || '{}');

    function toggleArgument(docid, type) {
        const proBtn = document.getElementById(`pro-btn-${docid}`);
        const conBtn = document.getElementById(`con-btn-${docid}`);
        if (!proBtn || !conBtn) return;

        const isPro = type === 'pro';
        const activeBtn = isPro ? proBtn : conBtn;
        const otherBtn = isPro ? conBtn : proBtn;

        const activeClass = isPro ? 'btn-success' : 'btn-danger';
        const outlineClass = isPro ? 'btn-outline-success' : 'btn-outline-danger';
        const otherActiveClass = isPro ? 'btn-danger' : 'btn-success';
        const otherOutlineClass = isPro ? 'btn-outline-danger' : 'btn-outline-success';

        const currentState = argumentSelections[docid];

        const titleElement = document.querySelector(`article[base_ir="${docid}"] h4 > span`);
        let fullTitle = titleElement ? titleElement.innerText.trim() : '0. Untitled Document';
        let title = fullTitle.replace(/^\d+\.\s*/, '');

        if (currentState === type) {
            activeBtn.classList.remove(activeClass);
            activeBtn.classList.add(outlineClass);
            delete argumentSelections[docid];
            delete savedTitles[docid];
        } else {
            activeBtn.classList.remove(outlineClass);
            activeBtn.classList.add(activeClass);
            otherBtn.classList.remove(otherActiveClass);
            otherBtn.classList.add(otherOutlineClass);
            argumentSelections[docid] = type;
            savedTitles[docid] = title;
        }

        localStorage.setItem('argumentSelections', JSON.stringify(argumentSelections));
        localStorage.setItem('savedTitles', JSON.stringify(savedTitles));

        updateCounters();
    }

    function restoreButtonStates() {
        for (const docid in argumentSelections) {
            const type = argumentSelections[docid];
            const isPro = type === 'pro';

            const proBtn = document.getElementById(`pro-btn-${docid}`);
            const conBtn = document.getElementById(`con-btn-${docid}`);

            if (!proBtn || !conBtn) continue;

            if (isPro) {
                proBtn.classList.remove('btn-outline-success');
                proBtn.classList.add('btn-success');
                conBtn.classList.remove('btn-danger');
                conBtn.classList.add('btn-outline-danger');
            } else {
                conBtn.classList.remove('btn-outline-danger');
                conBtn.classList.add('btn-danger');
                proBtn.classList.remove('btn-success');
                proBtn.classList.add('btn-outline-success');
            }
        }
    }

    function updateCounters() {
        let proCount = 0, conCount = 0;
        for (const key in argumentSelections) {
            if (argumentSelections[key] === 'pro') proCount++;
            if (argumentSelections[key] === 'con') conCount++;
        }

        const pcount = document.getElementById('pro-count');
        if (pcount) pcount.textContent = proCount;

        const ccount = document.getElementById('con-count');
        if (ccount) ccount.textContent = conCount;
    }

    document.addEventListener('DOMContentLoaded', () => {
        restoreButtonStates();
        updateCounters();
    });
    </script>

    <script>
    function clearClientData() {
        if (window.studyLogger && typeof window.studyLogger.clearClientData === 'function') {
            window.studyLogger.clearClientData();
            return;
        }
        localStorage.clear();
        try {
            sessionStorage.clear();
        } catch (_) {}
    }
    </script>

    <script>
        window.SESSION_ID = {{ session_id|tojson }};
        window.TASK_NUMBER = {{ session.get('task_number')|tojson }};
        window.USER_ID = {{ session.get('user_id')|tojson }};
    </script>
    <script src="{{ url_for('static', filename='logger.js') }}"></script>
</body>
</html>
