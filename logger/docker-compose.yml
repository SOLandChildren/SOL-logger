services:
  search_app:
    build: ./search-app
    depends_on:
      - search_engine
    ports:
      - 7001:7001
    volumes:
      - ./search-app/templates/:/app/templates/   # ← Transferring HTML files
      - ./search-app/static/:/app/static/   # ← Mount the static folder here
      - ./search-app/data/:/data/
      - ./logs:/logs/
      - ./search-app/API_keys.json:/API_keys.json
      - ./search-app/service_account.json:/service_account.json
    environment:
      SEARCH_BACKEND: "vertex"  # ← Set the environment variable to "bm25" or "vertex" to change between search engines 
      GOOGLE_APPLICATION_CREDENTIALS: "/service_account.json"
      PYTHONUNBUFFERED: "1"
    networks:
      - frontend


  search_engine:
    build: ./search-engine
    volumes:
      - ./search-engine/index:/index/
    tty: true
    environment:
      WMODEL: BM25
    ports:
      - 7002:7002

    networks:
      - frontend

networks:
  frontend: