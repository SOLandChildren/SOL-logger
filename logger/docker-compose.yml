services:
  search_app:
    build: ./search-app
    ports:
      - "7001:7001"
    volumes:
      - ./search-app/data:/app/data
      - ./logs:/app/logs
      - ./search-app/API_keys.json:/app/API_keys.json:ro
      - ./search-app/service_account.json:/app/service_account.json:ro
    environment:
      SEARCH_BACKEND: "vertex"
      GOOGLE_APPLICATION_CREDENTIALS: "/app/service_account.json"
      FLASK_DEBUG: "0"
    networks:
      - frontend
    restart: unless-stopped

  # Local PyTerrier/BM25 backend. Off by default — only starts when the
  # `pyterrier` profile is activated:
  #   docker compose --profile pyterrier up --build
  # On the USI server we run Vertex-only, so this never starts there.
  search_engine:
    profiles: ["pyterrier"]
    build: ./search-engine
    expose:
      - "7002"
    volumes:
      - ./search-engine/index:/app/index
    tty: true
    environment:
      WMODEL: BM25
    networks:
      - frontend
    restart: unless-stopped

networks:
  frontend:
