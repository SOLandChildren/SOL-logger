# nginx reverse proxy for SOL-logger
#
# If USI IT installs nginx directly on solar.usilu.net (one-time):
#   sudo cp '/home/rotam@usi.ch/sol-logger/logger/nginx/sol-logger.conf' /etc/nginx/sites-available/sol-logger
#   # edit the copy: replace <YOUR_USI_HOSTNAME> with the assigned hostname
#   sudo ln -sf /etc/nginx/sites-available/sol-logger /etc/nginx/sites-enabled/sol-logger
#   sudo nginx -t && sudo systemctl reload nginx
#
# If USI IT uses a perimeter/university reverse proxy instead, configure that
# proxy to forward to:
#   http://solar.usilu.net:7001/
#
# Enable HTTPS with Let's Encrypt:
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d <YOUR_USI_HOSTNAME>
#   sudo systemctl enable certbot.timer
# certbot will rewrite this file in place to add the 443 ssl block and an HTTP-to-HTTPS redirect.

server {
    listen 80;
    server_name <YOUR_USI_HOSTNAME>;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:7001;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }
}
